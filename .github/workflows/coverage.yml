name: Coverage

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    name: Coverage
    permissions:
      contents: read
      id-token: write # Authenticate Codecov uploads with OIDC.

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        id: rust
        background: true
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: llvm-tools-preview

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Enter Nix devshell
        id: devshell
        background: true
        uses: nicknovitski/nix-develop@v1.2.1

      - name: Wait for Rust
        wait: rust

      - name: Install cargo-llvm-cov,cargo-nextest
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Wait for Nix devshell
        wait: devshell

      - name: Generate code coverage
        env:
          NEXTEST_PROFILE: ci
        run: just test-coverage-codecov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.0
        with:
          use_oidc: true
          files: codecov.json
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }} # run when tests fail too
        uses: codecov/codecov-action@v7.1.0
        with:
          use_oidc: true
          report_type: test_results
          files: target/nextest/ci/junit.xml
          fail_ci_if_error: true
